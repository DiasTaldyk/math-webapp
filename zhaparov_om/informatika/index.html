
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Информатика жаттықтырғышы</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1>Информатика жаттықтырғышы</h1>

    <div id="setup">
      <label>Тақырып:
        <select id="topic">
          <option value="mixed">Аралас</option>
          <option value="arith">Арифметикалық операторлар</option>
          <option value="intdiv">Бүтін бөлу және қалдық (//, %)</option>
          <option value="power">Дәрежелеу (**)</option>
          <option value="roundfns">Дөңгелектеу (round, int, abs)</option>
          <option value="mathfns">Математикалық функциялар</option>
          <option value="numsys">Санау жүйелері (bin, oct, hex)</option>
          <option value="logic">Логикалық операторлар</option>
          <option value="strings">Жол ұзындығы (len)</option>
        </select>
      </label>

      <label>Тапсырма саны:
        <input type="number" id="numQuestions" value="5" min="1" max="100" />
      </label>

      <label>Бір тапсырмаға уақыт (сек):
        <input type="number" id="timePerQ" value="30" min="5" max="120" />
      </label>

      <button onclick="startQuiz()">Бастау</button>
    </div>

    <div id="quiz" style="display: none;">
      <p id="timer">Қалған уақыт: 30 сек.</p>
      <p id="question" class="code"></p>
      <input type="text" id="answer" placeholder="Жауабыңды жаз"
             onkeydown="handleKey(event)" autocomplete="off" autocapitalize="off" />
      <button onclick="submitAnswer()">Жауап беру</button>
      <p id="score-box">Дұрыс жауаптар: <span id="score">0</span></p>
    </div>

    <div id="result" style="display: none;">
      <label>Күн бойынша сүзгі: <input type="date" id="filterDate" onchange="filterHistory()" /></label>
      <div id="historyTable"></div>

      <h2>Нәтиже</h2>
      <p id="finalScore"></p>
      <div id="review"></div>

      <button onclick="clearHistory()">Тарихты тазарту</button>

      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <canvas id="progressChart" width="400" height="200"></canvas>

      <button onclick="restart()">Қайта бастау</button>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const tg = window.Telegram?.WebApp;
      tg?.expand();
      console.log("Қосымша іске қосылды");
    });
  </script>
</body>
</html>
